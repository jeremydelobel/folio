  <body class="landing-v2-page">
    <div class="page-transition" aria-hidden="true">
      <div class="page-transition__surface">
        <div class="landing-loader" hidden>
          <div class="landing-loader__command" aria-hidden="true"></div>
          <div
            class="landing-loader__track"
            role="progressbar"
            aria-label="Preparing portfolio media"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="landing-loader__progress"></div>
          </div>
        </div>
      </div>
    </div>
    <main class="landing-v2" aria-label="Portfolio categories">
      <a
        class="landing-v2-panel landing-v2-panel--video"
        href="/video"
        aria-label="View editing and motion projects"
      >
        <span class="landing-v2-media" aria-hidden="true">
          <span class="landing-v2-media-visual">
            <video
              class="landing-v2-video"
              muted
              loop
              playsinline
              disablepictureinpicture
              preload="auto"
              tabindex="-1"
            >
            </video>
          </span>
        </span>
        <span class="landing-v2-caption">
          <span class="landing-v2-title">EDITING &amp; MOTION</span>
          <span class="landing-v2-subtitle">Entertainment, Commercial</span>
        </span>
      </a>

      <a
        class="landing-v2-panel landing-v2-panel--photography"
        href="/photography"
        aria-label="View photography projects"
      >
        <span class="landing-v2-media" aria-hidden="true">
          <span
            class="landing-v2-media-visual landing-v2-slideshow"
            data-photography-slideshow
          >
            <img
              class="landing-v2-photo is-active"
              alt=""
              decoding="async"
              draggable="false"
            />
            <img
              class="landing-v2-photo"
              alt=""
              decoding="async"
              draggable="false"
            />
          </span>
        </span>
        <span class="landing-v2-caption">
          <span class="landing-v2-title">PHOTOGRAPHY</span>
          <span class="landing-v2-subtitle">Esport, Charity Events</span>
        </span>
      </a>
    </main>
  </body>
