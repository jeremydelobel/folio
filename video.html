  <head>
    <meta charset="UTF-8" />

    <script src="/rsrc/js/page-transition.js?v=20260928-v2" defer></script>
    <link rel="canonical" href="https://jeremydelobel.fr/video" />
    <meta name="theme-color" content="#000000" />
    <title>Jérémy Delobel | Video editing &amp; Motion design</title>

    <meta property="og:site_name" content="Jérémy Delobel" />
    <meta property="og:title" content="Jérémy Delobel | Video editing &amp; Motion design" />

    <meta property="og:url" content="https://jeremydelobel.fr/video" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jérémy Delobel | Video editing &amp; Motion design" />
    <meta name="twitter:description" content="I&#x27;m a France-based freelance creative specializing in social media content and live esports events." />
    <meta name="twitter:image" content="https://jeremydelobel.fr/rsrc/social/opengraph.png" />
    <meta name="twitter:image:alt" content="A selection of Jérémy Delobel’s video editing, motion design and photography work." />
    <link rel="icon" href="/rsrc/social/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic:wght@400..700&amp;display=swap" rel="stylesheet" />
    <link rel="preload" href="/rsrc/font/JetBrainsMono-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/rsrc/video/styles.css?v=20260929-concept-shade" />
    <script src="/rsrc/video/app.js?v=20260929-concept-shade" type="module"></script>
    <link rel="stylesheet" href="/rsrc/css/media-loading.css?v=20260928-v2" />
  </head>
  <body data-page-transition>
    <div class="page-transition" aria-hidden="true">
      <div class="page-transition__surface"></div>
    </div>
    <a class="page-menu" href="/" lang="en">Menu</a>
    <main class="project" data-state="loading" aria-busy="true" aria-label="Projets vidéo" aria-roledescription="carrousel">
      <div class="project__slides"></div>

      <button class="project__nav project__nav--previous" type="button" data-direction="-1" aria-label="Projet précédent" hidden>
        <span class="project__arrow"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 5-5 5 5 5" /></svg></span>
      </button>
      <button class="project__nav project__nav--next" type="button" data-direction="1" aria-label="Projet suivant" hidden>
        <span class="project__arrow"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 5 5 5-5 5" /></svg></span>
      </button>
      <p class="project__announcement sr-only" role="status" aria-live="polite"></p>
      <span class="project__cursor" aria-hidden="true">VIEW MORE</span>

      <div class="project__status" role="status" aria-live="polite">
        <span class="project__loader" aria-hidden="true"></span>
        <p class="project__message sr-only">Chargement du projet…</p>
        <button class="project__retry" type="button" hidden>Réessayer</button>
      </div>

      <button class="project__playback" type="button" aria-label="Lire la vidéo" title="Lire la vidéo" data-paused="true" hidden>
        <svg class="icon-play" viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 3.5 16 10 6 16.5Z" /></svg>
        <svg class="icon-pause" viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M5 4h3v12H5zm7 0h3v12h-3z" /></svg>
      </button>
    </main>
    <template id="project-slide">
      <article class="project__slide" aria-hidden="true">
        <div class="project__media" aria-hidden="true"><video class="project__video" muted loop playsinline disablepictureinpicture preload="auto" tabindex="-1"></video></div>
        <a class="project__link" tabindex="-1"></a>
        <div class="project__identity">
          <ul class="project__skills" aria-label="Compétences"></ul>
          <h1 class="project__title"></h1>
        </div>
      </article>
    </template>
    <noscript><p class="no-script">Active JavaScript pour afficher le projet.</p></noscript>
  </body>
</html>
