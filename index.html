    <script src="./script.js?v=20260715-home-media" defer></script>
  </head>
  <body>
    <div class="page-transition" aria-hidden="true"></div>

    <main class="landing">
      <section class="intro meta-block" aria-label="Presentation">
        <div class="text-reveal-mask text-line-1">
          <h1 class="meta-title text-reveal-value" data-i18n="name">
            Jérémy "Kota" Delobel
          </h1>
        </div>
        <div class="text-reveal-mask text-line-2">
          <p class="meta-subtitle text-reveal-value" data-i18n="roles">
            Video Editor, Motion Designer &amp; Photographer
          </p>
        </div>
      </section>

      <section class="location meta-block" aria-label="Location">
        <div class="text-reveal-mask text-line-1">
          <p class="meta-title text-reveal-value" data-i18n="locationLine1">
            Based in Angoulême,
          </p>
        </div>
        <div class="text-reveal-mask text-line-2">
          <p class="meta-subtitle text-reveal-value" data-i18n="locationLine2">
            France
          </p>
        </div>
      </section>

      <section class="categories" aria-label="Categories">
        <article class="category-card" data-route="./video-editing.html">
          <div class="category-inner">
            <div class="category-frame">
              <div class="category-visual">
                <video
                  class="category-video"
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="auto"
                  poster="./rsrc/Poster - VIDEO EDITING.jpg"
                >
                  <source
                    data-src="./rsrc/Thumbnail - VIDEO EDITING.mp4"
                    type="video/mp4"
                  />
                </video>
              </div>
            </div>
            <div class="category-label-mask">
              <p><span class="category-label-value" data-i18n="cardVideo">VIDEO EDITING</span></p>
            </div>
          </div>
        </article>

        <article class="category-card" data-route="./photography.html">
          <div class="category-inner">
            <div class="category-frame">
              <div class="category-visual">
                <div
                  class="category-photo-slideshow"
                  data-photography-slideshow
                  aria-hidden="true"
                >
                  <img class="category-photo" alt="" decoding="async" />
                  <img class="category-photo" alt="" decoding="async" />
                </div>
              </div>
            </div>
            <div class="category-label-mask">
              <p><span class="category-label-value" data-i18n="cardPhotography">PHOTOGRAPHY</span></p>
            </div>
          </div>
        </article>

        <article class="category-card" data-route="./motion-design.html">
          <div class="category-inner">
            <div class="category-frame">
              <div class="category-visual">
                <video
                  class="category-video"
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="auto"
                  poster="./rsrc/Poster - MOTION DESIGN.jpg"
                >
                  <source
                    data-src="./rsrc/Thumbnail - MOTION DESIGN.mp4"
                    type="video/mp4"
                  />
                </video>
              </div>
            </div>
            <div class="category-label-mask">
              <p>
                <span class="category-label-value" data-i18n="cardMotion">MOTION DESIGN</span>
              </p>
            </div>
          </div>
        </article>
      </section>

      <nav class="social-links social-links-fixed" aria-label="Social media">
        <a
          class="social-link"
          href="https://x.com/kotarow28"
          target="_blank"
          rel="noreferrer"
          aria-label="X"
        >
          <img src="./rsrc/social-icons/x.svg" alt="" />
        </a>
        <a
          class="social-link"
          href="https://www.instagram.com/jeremy.delobel/"
          target="_blank"
          rel="noreferrer"
          aria-label="Instagram"
        >
          <img src="./rsrc/social-icons/instagram.svg" alt="" />
        </a>
        <a
          class="social-link"
          href="mailto:kotarow.montage@gmail.com"
          aria-label="Email"
        >
          <img src="./rsrc/social-icons/mail.svg" alt="" />
        </a>
      </nav>
    </main>
  </body>
</html>
