<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jérémy Delobel - Event Photographer</title>
    <meta
      name="description"
      content="Selected event and esports photography by Jérémy Delobel, including the Esports World Cup, RLCS and more."
    />
    <link rel="canonical" href="https://jeremydelobel.fr/photography.html" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Jérémy Delobel" />
    <meta
      property="og:title"
      content="Esports Photography Portfolio — Jérémy Delobel"
    />
    <meta
      property="og:description"
      content="Selected event and esports photography by Jérémy Delobel, including the Esports World Cup, RLCS and more."
    />
    <meta property="og:url" content="https://jeremydelobel.fr/photography.html" />
    <meta property="og:image" content="https://jeremydelobel.fr/PreviewOpenGraph.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Collage showcasing Jérémy Delobel's YouTube and esports portfolio."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Esports Photography Portfolio — Jérémy Delobel"
    />
    <meta
      name="twitter:description"
      content="Selected event and esports photography by Jérémy Delobel, including the Esports World Cup, RLCS and more."
    />
    <meta name="twitter:image" content="https://jeremydelobel.fr/PreviewOpenGraph.jpg" />
    <meta
      name="twitter:image:alt"
      content="Collage showcasing Jérémy Delobel's YouTube and esports portfolio."
    />
    <link rel="stylesheet" href="./styles.css?v=20260726-lightbox-controls-v3" />
    <link rel="stylesheet" href="./rsrc/vendor/lenis/lenis.css" />
    <script src="./rsrc/vendor/lenis/lenis.min.js" defer></script>
    <script src="./script.js?v=20260819-photo-manager-v2" defer></script>
  </head>
  <body class="photography-page">
    <div class="page-transition is-visible" aria-hidden="true"></div>

    <main class="folio-page photography-page-shell">
      <button class="back-button text-reveal-mask text-line-1" type="button">
        <span class="text-reveal-value">
          <span class="back-button-label" data-i18n="backButton">Menu</span>
        </span>
      </button>

      <h1 class="folio-title text-reveal-mask text-line-1">
        <span class="text-reveal-value" data-i18n="photoPageTitle">Photography</span>
      </h1>

      <nav class="photo-tabs" aria-label="Photo collections" hidden>
        <div class="photo-tabs-list" role="tablist" aria-label="Collections"></div>
      </nav>

      <section
        class="photo-grid"
        id="photo-grid"
        role="tabpanel"
        aria-label="Gallery"
        aria-busy="true"
      ></section>

      <nav class="social-links social-links-inline" aria-label="Social media">
        <a
          class="social-link"
          href="https://x.com/kotarow28"
          target="_blank"
          rel="noreferrer"
          aria-label="X"
        >
          <img src="./rsrc/social-icons/x.svg" alt="" />
        </a>
        <a
          class="social-link"
          href="https://www.instagram.com/jeremy.delobel/"
          target="_blank"
          rel="noreferrer"
          aria-label="Instagram"
        >
          <img src="./rsrc/social-icons/instagram.svg" alt="" />
        </a>
        <a
          class="social-link"
          href="mailto:kotarow.montage@gmail.com"
          aria-label="Email"
        >
          <img src="./rsrc/social-icons/mail.svg" alt="" />
        </a>
      </nav>

      <div
        class="photo-lightbox"
        aria-hidden="true"
      >
        <button
          class="photo-lightbox-backdrop"
          type="button"
          aria-label="Close photo"
          data-photo-lightbox-close
        ></button>

        <div
          class="photo-lightbox-stage"
          role="dialog"
          aria-modal="true"
          aria-label="Enlarged photo"
        >
          <div class="photo-lightbox-canvas-shell" aria-hidden="true">
            <canvas class="photo-lightbox-canvas photo-lightbox-canvas-lowres"></canvas>
            <canvas class="photo-lightbox-canvas photo-lightbox-canvas-highres"></canvas>
          </div>
          <p class="photo-lightbox-caption" hidden></p>
        </div>

        <button
          class="photo-lightbox-close"
          type="button"
          aria-label="Close photo"
          data-photo-lightbox-close
        >
          <img src="./rsrc/Croix.svg" alt="" />
        </button>
      </div>
    </main>
  </body>
</html>
